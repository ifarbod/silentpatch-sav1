name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -a x86 -m release -y

      - name: Build
        run: xmake -y

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchSA
          path: build/windows/x86/release/SilentPatchSA.asi
          if-no-files-found: error
